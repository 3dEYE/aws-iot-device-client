name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: Branch to build from and target for the release
        required: true
        default: dev
      dry_run:
        description: Build binaries without creating a GitHub release
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

env:
  PACKAGE_NAME: aws-iot-device-client
  LOCAL_BUILD_IMAGE: aws-iot-device-client-release-builder:local

jobs:
  version:
    name: Resolve release revision and version
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.revision.outputs.commit_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0

      - name: Pin release revision
        id: revision
        shell: bash
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Derive version from release revision
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_tag=$(git describe --abbrev=0 --tags --match 'v[0-9]*')
          version_numbers=${version_tag#v}
          major=${version_numbers%%.*}
          minor_and_suffix=${version_numbers#*.}
          minor=${minor_and_suffix%%[^0-9]*}
          patch=$(git rev-list "${version_tag}..HEAD" --count)
          git_sha=$(git rev-parse --short HEAD)
          version="v${major}.${minor}.${patch}-${git_sha}"

          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ ]]; then
            echo "Unable to derive release version from tag: $version_tag" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.architecture }} binary
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            build_args: ""
            binary_path: build/aws-iot-device-client
            asset_name: aws-iot-device-client-linux-x64
          - architecture: arm32
            build_args: --compile-mode=armhf_cross_mode
            binary_path: build/aws-iot-device-client
            asset_name: aws-iot-device-client-linux-arm32
          - architecture: arm64
            build_args: --compile-mode=aarch64_cross_mode
            binary_path: build/aws-iot-device-client
            asset_name: aws-iot-device-client-linux-arm64
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit_sha }}
          fetch-depth: 0

      - name: Build binary
        env:
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --file .github/docker-images/base-images/device-client/ubuntu/Dockerfile \
            --target base \
            --tag "$LOCAL_BUILD_IMAGE" \
            .
          docker run \
            --mount "type=bind,source=$(pwd),target=/root/${PACKAGE_NAME}" \
            --env GITHUB_REF=refs/heads/${RELEASE_BRANCH} \
            "$LOCAL_BUILD_IMAGE" \
            ${{ matrix.build_args }}

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          install -m 0755 "${{ matrix.binary_path }}" "release-assets/${{ matrix.asset_name }}"

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release-assets/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    if: ${{ inputs.dry_run == 'false' }}
    needs:
      - version
      - build
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit_sha }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          RELEASE_SHA: ${{ needs.version.outputs.commit_sha }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$VERSION" \
            release-assets/* \
            --target "$RELEASE_SHA" \
            --title "$VERSION" \
            --notes "Release built from commit ${RELEASE_SHA} on the ${RELEASE_BRANCH} branch."
