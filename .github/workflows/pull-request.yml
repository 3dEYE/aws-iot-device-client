name: Build and test

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            mode: native
            runner: ubuntu-22.04
            job_name: Build and test x64
            step_name: Build and test
          - architecture: arm64
            mode: native
            runner: ubuntu-22.04-arm
            job_name: Build and test ARM64
            step_name: Build and test
          - architecture: arm32
            mode: cross
            runner: ubuntu-22.04
            job_name: Cross-build ARM32
            step_name: Cross-build and inspect

    env:
      AWS_IOT_DEVICE_SDK_CACHE_DIR: ${{ github.workspace }}/.ci-cache/aws-iot-device-sdk-cpp-v2
      CROSS_OPENSSL_CACHE_DIR: ${{ github.workspace }}/.ci-cache/cross-openssl
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test CI helpers
        if: matrix.architecture == 'x64' && matrix.mode == 'native'
        shell: bash
        run: |
          bash .github/ci/test-versioning.sh
          python3 -B .github/ci/test_summarize_test_results.py

      - name: Read pinned SDK revision
        id: sdk-pin
        shell: bash
        run: |
          sdk_commit="$(
            sed -n \
              's/^set(AWS_IOT_DEVICE_SDK_COMMIT \([0-9a-f]\{40\}\))$/\1/p' \
              cmake/AwsIotDeviceSdkPins.cmake
          )"
          if [[ ! "$sdk_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to read the pinned AWS IoT Device SDK commit" >&2
            exit 1
          fi
          echo "commit=$sdk_commit" >> "$GITHUB_OUTPUT"

      - name: Restore pinned SDK source
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: .ci-cache/aws-iot-device-sdk-cpp-v2
          key: aws-iot-device-sdk-source-v2-${{ steps.sdk-pin.outputs.commit }}

      - name: Checkout pinned SDK source
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: aws/aws-iot-device-sdk-cpp-v2
          ref: ${{ steps.sdk-pin.outputs.commit }}
          path: .ci-cache/aws-iot-device-sdk-cpp-v2
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned SDK submodules
        shell: bash
        run: |
          git config --global submodule.crt/aws-lc.update none
          git -C "$AWS_IOT_DEVICE_SDK_CACHE_DIR" \
            submodule update --init --recursive --force --depth 1

      - name: Restore cross-compiled OpenSSL
        if: matrix.mode == 'cross'
        uses: actions/cache@v5
        with:
          path: .ci-cache/cross-openssl
          key: >-
            cross-openssl-${{ matrix.runner }}-${{ matrix.architecture }}-3.5.7-${{
            hashFiles(
              '.github/ci/build-and-test.sh',
              'cmake-toolchain/Toolchain-armhf.cmake',
              'cmake-toolchain/Toolchain-aarch64.cmake'
            ) }}

      - name: Restore compiler cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: ${{ matrix.architecture }}-${{ matrix.mode }}-${{ matrix.runner }}-sdk-${{ steps.sdk-pin.outputs.commit }}
          restore-keys: |
            ${{ matrix.architecture }}-${{ matrix.mode }}-${{ matrix.runner }}-sdk-
          install: binary
          max-size: 500M

      - name: ${{ matrix.step_name }}
        shell: bash
        run: >-
          .github/ci/build-and-test.sh
          "${{ matrix.architecture }}"
          "${{ matrix.mode }}"
          Release

      - name: Finalize x64 test badge data
        if: >-
          ${{
            !cancelled() &&
            matrix.architecture == 'x64' &&
            matrix.mode == 'native'
          }}
        shell: bash
        run: |
          badge_dir="build/x64/test-results/badges"
          badge_files=(
            device-client.json
            aws-c-iot.json
            aws-c-mqtt.json
            iot-device-defender-cpp.json
          )
          for badge_file in "${badge_files[@]}"; do
            if [[ ! -s "${badge_dir}/${badge_file}" ]]; then
              python3 .github/ci/summarize_test_results.py \
                --results-dir build/x64/test-results \
                --badge-dir "$badge_dir"
              break
            fi
          done

      - name: Upload x64 test badge data
        if: >-
          ${{
            !cancelled() &&
            github.event_name == 'push' &&
            github.ref == 'refs/heads/dev' &&
            github.repository == '3dEYE/aws-iot-device-client' &&
            matrix.architecture == 'x64' &&
            matrix.mode == 'native'
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dev-test-badges-x64
          path: build/x64/test-results/badges
          if-no-files-found: error
          retention-days: 1

  publish-test-badges:
    name: Publish test badges
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/dev' &&
        github.repository == '3dEYE/aws-iot-device-client'
      }}
    needs: build-and-test
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download x64 test badge data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dev-test-badges-x64
          path: ${{ runner.temp }}/test-badge-data

      - name: Publish test badge data
        shell: bash
        env:
          BADGE_BRANCH: badges
        run: |
          set -euo pipefail

          badge_files=(
            device-client.json
            aws-c-iot.json
            aws-c-mqtt.json
            iot-device-defender-cpp.json
          )
          for badge_file in "${badge_files[@]}"; do
            if [[ ! -s "${RUNNER_TEMP}/test-badge-data/${badge_file}" ]]; then
              echo "Missing badge data: ${badge_file}" >&2
              exit 1
            fi
            python3 -m json.tool \
              "${RUNNER_TEMP}/test-badge-data/${badge_file}" \
              >/dev/null
          done

          remote_dev="$(
            git ls-remote origin refs/heads/dev |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "$remote_dev" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale badge data for ${GITHUB_SHA}."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$BADGE_BRANCH" \
              >/dev/null; then
            git fetch origin "$BADGE_BRANCH"
            git switch --force-create "$BADGE_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$BADGE_BRANCH"
          fi

          mkdir -p badges
          for badge_file in "${badge_files[@]}"; do
            cp \
              "${RUNNER_TEMP}/test-badge-data/${badge_file}" \
              "badges/${badge_file}"
          done

          git add badges
          if git diff --cached --quiet; then
            echo "Test badge data is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update test badges for ${GITHUB_SHA:0:12}"
          git push origin "HEAD:refs/heads/${BADGE_BRANCH}"
